<body>
<title>Blubirch Delivery Verification</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: inputs on the left, result on the right on wide screens; one stacked column on phones. Brand blue and green. */
:root {
  /* Blubirch palette, sampled from blubirch.com: blue #003c9e, green #00b10d, navy text #1a1b35, lavender #ededf8, light blue #e0eefa */
  --bg: #ffffff;
  --surface: #ffffff;
  --subtle: #ededf8;
  --band: #e0eefa;
  --border: #dcdceb;
  --border-strong: #b4b5c9;
  --text: #1a1b35;
  --muted: #5c5d78;
  --accent: #003c9e;
  --accent-hover: #002e7a;
  --accent-ink: #ffffff;
  --accent-soft: #e0eefa;
  --brand-green: #00b10d;
  --logo-ink: #154a8d;
  --footer-bg: #003c9e;
  --footer-ink: #ffffff;
  --ok: #007f09; --ok-bg: #e2f6e4;
  --warn: #8f5606; --warn-bg: #fff4dd;
  --bad: #b3261e; --bad-bg: #fdecea;
  --mark: #ffe08a; --mark-ink: #3a2a00;
  --shadow: 0 1px 2px rgba(26, 27, 53, .06);
  --f-ui: "Red Hat Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-head: "Montserrat", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter: clamp(20px, 5vw, 40px);
  --pad: clamp(18px, 4vw, 28px);
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050608; --surface: #0e0f17; --subtle: #171929; --band: #0c1424; --border: #25273a; --border-strong: #3b3e58; --text: #ececf6; --muted: #a2a4ba;
    --accent: #7ea4f4; --accent-hover: #98b6f7; --accent-ink: #050d24; --accent-soft: #131f3f; --brand-green: #1fc42b; --logo-ink: #ffffff; --footer-bg: #0a1f4d; --footer-ink: #e8eefc;
    --ok: #3fd14a; --ok-bg: #0e2a13; --warn: #e6ad55; --warn-bg: #2f2209; --bad: #f2867c; --bad-bg: #381614;
    --mark: #d7a51b; --mark-ink: #1a1200; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050608; --surface: #0e0f17; --subtle: #171929; --band: #0c1424; --border: #25273a; --border-strong: #3b3e58; --text: #ececf6; --muted: #a2a4ba;
  --accent: #7ea4f4; --accent-hover: #98b6f7; --accent-ink: #050d24; --accent-soft: #131f3f; --brand-green: #1fc42b; --logo-ink: #ffffff; --footer-bg: #0a1f4d; --footer-ink: #e8eefc;
  --ok: #3fd14a; --ok-bg: #0e2a13; --warn: #e6ad55; --warn-bg: #2f2209; --bad: #f2867c; --bad-bg: #381614;
  --mark: #d7a51b; --mark-ink: #1a1200; --shadow: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-family: var(--f-head); }
svg { flex: none; }

.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.appbar-in { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); min-height: 56px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { height: 20px; width: auto; display: block; flex: none; }
.logo-ink { fill: var(--logo-ink); }
.product { font: 600 13px/1.3 var(--f-head); color: var(--text); padding-left: 14px; border-left: 1px solid var(--border-strong); min-width: 0; letter-spacing: .005em; }
.btn.icon { width: 34px; padding: 0; }
.band { background: var(--band); }
.band-in { max-width: 1280px; margin: 0 auto; padding: 20px var(--gutter); display: flex; flex-direction: column; gap: 6px; }
.band h1 { font-size: clamp(21px, 2.6vw, 26px); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.band h1 em { font-style: normal; color: var(--ok); }
.band p { color: var(--muted); }
@media (max-width: 620px) { .brand { flex-direction: column; align-items: flex-start; gap: 4px; } .logo { height: 18px; } .product { border-left: 0; padding-left: 0; font-size: 11.5px; font-weight: 500; color: var(--muted); } .band-in { padding-block: 16px; } }
.appbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none; }
.tagline { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tagline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-green); }
.narrow { display: none; }
@media (max-width: 620px) { .tagline, .wide { display: none; } .narrow { display: inline; } .card-head { flex-wrap: wrap; row-gap: 2px; } .card-head .state { margin-left: 38px; flex-basis: 100%; white-space: normal; } }

.page { max-width: 1280px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 24px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.span { grid-column: 1 / -1; }
@media (min-width: 900px) { .page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; } .page > .card { height: 100%; } }
.intro { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.intro h1 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; line-height: 1.25; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.card.pending { box-shadow: none; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 18px var(--pad); }
.card-head h2 { font-size: 16.5px; font-weight: 600; line-height: 1.3; }
.card-head .state { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.card-body { padding: 0 var(--pad) var(--pad); display: flex; flex-direction: column; gap: 16px; }
.card.pending .card-head h2, .card.pending .card-body { color: var(--muted); }
.stepno { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1.5px solid var(--border-strong); color: var(--muted); }
.stepno.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepno.done { background: var(--brand-green); border-color: var(--brand-green); color: #fff; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 600; letter-spacing: .01em; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--subtle); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 520px) { .actions > .btn { flex: 1 1 100%; height: 46px; font-size: 15px; } }

.drop { border: 1px dashed var(--border-strong); border-radius: var(--r); background: var(--subtle); padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 32px; height: 32px; color: var(--accent); }
.drop { flex: 1; justify-content: center; min-height: 316px; }
.drop-text { display: flex; flex-direction: column; gap: 8px; }
.drop-text b { font: 600 17px/1.35 var(--f-head); }
.drop-text span { font-size: 14.5px; line-height: 1.5; color: var(--muted); }
.drop-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
.drop-btns .btn { height: 44px; padding: 0 22px; font-size: 14.5px; }
.drop .link { margin-top: 12px; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.drop .link:hover { text-decoration-thickness: 2px; }
.sublinks { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
.link { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--accent); }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.page > .card { display: flex; flex-direction: column; }
.page > .card > .card-body { flex: 1; }
.filerow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); background: var(--subtle); }
.filerow svg { width: 22px; height: 22px; color: var(--brand-green); }
.filerow .fn { font-weight: 500; overflow-wrap: anywhere; }
.filerow > div { min-width: 0; flex: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.input, .field select, .field textarea { height: 40px; width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 14px; }
.field textarea { height: 140px; padding: 10px 12px; font-family: var(--f-code); }

.notice { border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.notice b { font-weight: 600; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--accent-soft); color: var(--text); }

.pages { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r); }
.pg { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; }
.pg + .pg { border-top: 1px solid var(--border); }
.pg img, .pg .ph { width: 40px; height: 52px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); background: var(--subtle); display: block; }
.pg .pn { font-weight: 500; font-size: 14px; }
.meter { height: 4px; border-radius: 2px; background: var(--subtle); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.mut { background: var(--subtle); color: var(--muted); }
.spin { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: var(--r); overflow: hidden; background: var(--subtle); }
.stat { padding: 16px 18px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat .lbl { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.stat .num { font-family: var(--f-head); font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.stat .of { font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--brand-green); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
@media (max-width: 480px) { .tab { padding: 10px 8px; } .tab .ct { display: none; } .tabs { gap: 8px; } .strip img { height: 36px; } .stats { grid-template-columns: 1fr; } .stat + .stat { border-left: 0; border-top: 1px solid var(--border); } .stat { padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; } .stat .num { grid-row: 1 / 3; grid-column: 2; margin: 0; font-size: 26px; } .stat .of { grid-column: 1; } }

.review { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.review-head { padding: 12px 16px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.review-head b { font-weight: 600; }
.rv { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); }
.strip { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 4px; overflow-x: auto; }
.strip img { display: block; height: 44px; max-width: none; }
.readas { font: 500 15px/1.5 var(--f-code); overflow-wrap: anywhere; }
.readas mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices .btn { height: auto; min-height: 40px; padding: 8px 14px; white-space: normal; text-align: left; }
.code { font-family: var(--f-code); font-weight: 500; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { all: unset; box-sizing: border-box; cursor: pointer; padding: 10px 12px; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .ct { font-size: 12px; background: var(--subtle); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.table { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.thead, .tr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; }
.thead { height: 38px; background: var(--subtle); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.tr { min-height: 44px; padding-block: 8px; border-top: 1px solid var(--border); }
.tr .code { font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }
.footer { background: var(--footer-bg); color: var(--footer-ink); }
.footer-in { max-width: 1280px; margin: 0 auto; padding: 14px var(--gutter); display: flex; flex-wrap: wrap; gap: 4px 24px; justify-content: space-between; align-items: center; font-size: 12.5px; }
.footer b { font-weight: 600; }
.footer .sep { opacity: .55; padding: 0 6px; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.page { flex: 1 0 auto; width: 100%; align-content: start; }
.who { gap: 8px; padding: 0 12px 0 4px; max-width: 190px; }
.who i { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 12px var(--f-head); font-style: normal; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 620px) { .who { padding: 0 4px; } .who span { display: none; } }
.alt { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r); }
.alt > div { flex: 1; min-width: 0; }
.modal .card.wide-modal { max-width: 620px; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.hrow + .hrow { border-top: 1px solid var(--border); }
.hrow > div:first-child { flex: 1; }
.hrow .pn { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.hbtns { display: flex; gap: 4px; flex: none; }
.typed { display: flex; gap: 8px; }
.typed .input { flex: 1; min-width: 0; }
.modal .choices .btn.primary { color: var(--accent-ink); }

.toast { position: fixed; left: 20px; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 460px; background: var(--text); color: var(--bg); border-radius: 8px; padding: 12px 16px; font-size: 14px; z-index: 9; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
.modal { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); z-index: 10; display: grid; place-items: center; padding: 20px; }
.modal .card { width: 100%; max-width: 420px; max-height: calc(100% - 20px); overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 17px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .meter i, .btn { transition: none; } }
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => (b % 36).toString(36)).join("");
const abs = p => new URL(p, document.baseURI).href;
const plural = (n, w) => n + " " + w + (n === 1 ? "" : (w.endsWith("x") ? "es" : "s"));

/* ---------- box-number matching (pure logic) ----------
   Letters and digits that print alike (O and 0, I and 1, S and 5, B and 8, Z and 2, G and 6) are folded
   together for matching. A read is accepted only when it folds to exactly one box on the expected list. */
const CANON = { O: "0", Q: "0", D: "0", I: "1", L: "1", S: "5", B: "8", Z: "2", G: "6" };
const UNCANON = { "0": "O", "1": "I", "5": "S", "8": "B", "2": "Z", "6": "G" };
const cleanCode = v => String(v ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const canon = s => s.replace(/[OQDILSBZG]/g, c => CANON[c]);
const isDigit = ch => ch >= "0" && ch <= "9";
const countDigits = s => { let n = 0; for (const ch of s) if (isDigit(ch)) n++; return n; };
function makeProfile(codes) {
  const lens = new Set(codes.map(c => c.length)), arr = [...lens];
  const numeric = codes.every(c => /^\d+$/.test(c));
  const mask = new Map();
  for (const len of lens) {
    const m = [];
    for (let i = 0; i < len; i++) {
      let d = true, a = true;
      for (const c of codes) { if (c.length !== len) continue; if (isDigit(c[i])) a = false; else d = false; if (!d && !a) break; }
      m.push(d ? "d" : a ? "a" : "x");
    }
    mask.set(len, m);
  }
  let minDigits = Infinity, sumRatio = 0;
  for (const c of codes) { const n = countDigits(c); if (n < minDigits) minDigits = n; sumRatio += n / c.length; }
  return { lens, numeric, mask, minLen: Math.min(...arr), maxLen: Math.max(...arr), minDigits, digitRatio: sumRatio / codes.length,
    tol: Math.max(1, Math.min(3, Math.floor(Math.min(...arr) / 7))), wide: Math.max(2, Math.ceil(Math.min(...arr) / 4)), whitelist: "" };
}
/* Rewrite a read using what each position is known to hold: a digit position showing "O" becomes "0", and so on. */
function shape(n, P) {
  const m = P.mask.get(n.length); if (!m) return n;
  let out = "";
  for (let i = 0; i < n.length; i++) { const ch = n[i]; out += m[i] === "d" ? (CANON[ch] || ch) : m[i] === "a" ? (UNCANON[ch] || ch) : ch; }
  return out;
}
function fitsShape(n, P) {
  const m = P.mask.get(n.length); if (!m) return false;
  for (let i = 0; i < n.length; i++) {
    const ch = n[i], dg = isDigit(ch);
    if (m[i] === "d" && !dg && !CANON[ch]) return false;
    if (m[i] === "a" && dg && !UNCANON[ch]) return false;
  }
  return countDigits(shape(n, P)) >= Math.max(P.minDigits > 0 ? 1 : 0, P.minDigits - 2);
}
function lineCandidates(words, P) {
  const lower = { g: "9", q: "9", b: "6", l: "1", o: "0", s: "5", z: "2" };
  const pcs = words.map(w => ({ w, n: cleanCode(P.numeric ? String(w.text || "").replace(/[gqblosz]/g, c => lower[c]) : w.text) }));
  const out = [];
  const tok = (list, near) => {
    const b = { x0: 1e9, y0: 1e9, x1: 0, y1: 0 }; let conf = 100;
    for (const p of list) { b.x0 = Math.min(b.x0, p.w.bbox.x0); b.y0 = Math.min(b.y0, p.w.bbox.y0); b.x1 = Math.max(b.x1, p.w.bbox.x1); b.y1 = Math.max(b.y1, p.w.bbox.y1); conf = Math.min(conf, p.w.confidence ?? 0); }
    const raw = list.map(p => p.n).join("");
    out.push({ norm: near ? (P.numeric ? canon(raw) : raw) : shape(raw, P), canon: canon(raw), bbox: b, conf, near: !!near, joined: list.length > 1 });
  };
  const joinable = n => P.numeric ? /^\d+$/.test(canon(n)) : true;
  let i = 0;
  while (i < pcs.length) {
    const p = pcs[i];
    if (!p.n) { i++; continue; }
    if (fitsShape(p.n, P)) { tok([p]); i++; continue; }
    let found = -1;
    if (joinable(p.n)) {
      let acc = p.n, j = i;
      while (j + 1 < pcs.length && j - i < 8) {
        const q = pcs[j + 1], prev = pcs[j];
        if (!q.n || !joinable(q.n)) break;
        const h = Math.max(prev.w.bbox.y1 - prev.w.bbox.y0, 1);
        if (q.w.bbox.x0 - prev.w.bbox.x1 > h * 1.6) break;
        acc += q.n; j++;
        if (fitsShape(acc, P)) { found = j; break; }
        if (acc.length > P.maxLen) break;
      }
    }
